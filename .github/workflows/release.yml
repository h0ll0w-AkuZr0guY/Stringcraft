name: Build Preview Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: Also build the independent CPU music environment
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: python scripts/build-local.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-base
          path: artifacts/*.zip
      - name: Publish preview
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $taskAssets = @(Get-ChildItem -LiteralPath artifacts -Filter '*.zip' | ForEach-Object FullName)
          gh release view $env:GITHUB_REF_NAME 1>$null 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME @taskAssets
          } else {
            gh release create $env:GITHUB_REF_NAME @taskAssets --prerelease --title "Stringcraft $env:GITHUB_REF_NAME" --notes-file docs/RELEASES.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Preview publication failed' }
      - uses: astral-sh/setup-uv@v6
        if: inputs.environment
      - run: ./scripts/build-environment.ps1 -WithModels
        if: inputs.environment
      - uses: actions/upload-artifact@v4
        if: inputs.environment
        with:
          name: windows-music-environment
          path: artifacts/Stringcraft-local-music-*.zip
