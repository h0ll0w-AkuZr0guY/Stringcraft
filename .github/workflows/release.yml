name: Build Windows Release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: python scripts/build-local.py
      - run: python scripts/build-runtime-extensions.py --output-root artifacts/extensions
      - uses: actions/upload-artifact@v4
        with:
          name: windows-core
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: music-runtime-installers
          path: artifacts/extensions/*
          if-no-files-found: error
